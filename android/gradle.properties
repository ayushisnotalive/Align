# ── Gradle / Android properties ───────────────────────────────────────────────
# Required for all modern AndroidX + Jetpack Compose projects.
android.useAndroidX=true

# Non-transitive R classes: each module only sees its own resources.
# Speeds up incremental compilation and avoids resource id collisions.
android.nonTransitiveRClass=true

# Use the Kotlin daemon for faster incremental Kotlin compilation.
kotlin.daemon.jvm.options=-Xmx2g

# Suppress JVM toolchain warning on Java 21+.
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
